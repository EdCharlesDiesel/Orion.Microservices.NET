  orion.api.transactionhistoryarchive:
    image: orion.api.transactionhistoryarchive
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PROJECT_PATH: src/API/Orion.API.TransactionHistoryArchive/Orion.API.TransactionHistoryArchive.csproj
        APP_DLL: Orion.API.TransactionHistoryArchive.dll
    environment:
      ASPNETCORE_URLS: http://+:5000
