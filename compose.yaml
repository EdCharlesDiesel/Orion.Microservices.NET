        APP_DLL: Orion.WebApps.HealthCheckUI.dll
    environment:
      ASPNETCORE_URLS: http://+:5000
      HealthChecksUI__HealthChecks__0__Name: AWBuildVersion API
      HealthChecksUI__HealthChecks__0__Uri: http://orion.api.awbuildversion:5000/health
      HealthChecksUI__HealthChecks__1__Name: DatabaseLog API
      HealthChecksUI__HealthChecks__1__Uri: http://orion.api.databaselog:5000/health
      HealthChecksUI__HealthChecks__2__Name: Ocelot Gateway
      HealthChecksUI__HealthChecks__2__Uri: http://orion.ocelot.gateway:5000/health
