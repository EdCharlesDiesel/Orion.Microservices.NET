    environment:
      ASPNETCORE_URLS: http://+:5000
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=OrionProductionDatabase;Username=postgres;Password=$ta99Ath0
      Kafka__BootstrapServers: kafka:9093
    depends_on:
