    environment:
      ASPNETCORE_URLS: http://+:5000
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=OrionProductionDatabase;Username=postgres;Password=$ta99Ath0
      Kafka__BootstrapServers: kafka:9093
    depends_on:
      - postgres
      - kafka
    ports:
      - "8084:5000"
    networks:
      - orion-net

  orion.api.userprofile:
    image: orion.api.userprofile
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PROJECT_PATH: src/API/Orion.API.UserProfile/Orion.API.UserProfile.csproj
        APP_DLL: Orion.API.UserProfile.dll
    environment:
      ASPNETCORE_URLS: http://+:5000
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=OrionProductionDatabase;Username=postgres;Password=$ta99Ath0
      Kafka__BootstrapServers: kafka:9093
    depends_on:
      - postgres
      - kafka
    ports:
      - "8085:5000"
    networks:
      - orion-net

  orion.api.person:
    image: orion.api.person
    build:
