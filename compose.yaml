    ports:
      - "8089:5000"
    networks:
      - orion-net

  # ==================== GATEWAYS & APPS ====================

  orion.external.paymentgateway:
    image: orion.external.paymentgateway
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PROJECT_PATH: src/ApiGateways/External.PaymentGateway/Orion.External.PaymentGateway.csproj
        APP_DLL: Orion.External.PaymentGateway.dll
